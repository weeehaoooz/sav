<div class="sav-dialog fade-in">
  <header class="dialog-header">
    <div class="title-area">
      <h2 class="dialog-title">Valuation History</h2>
      <span class="asset-name">{{ data.asset.name }}</span>
    </div>
    <button class="close-btn" (click)="dialogRef.close()" aria-label="Close">
      <span class="material-icons">close</span>
    </button>
  </header>

  <div class="dialog-body">
    @if (loading()) {
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Syncing valuations...</p>
      </div>
    } @else if (history().length === 0) {
      <div class="empty-state">
        <span class="material-icons">history_toggle_off</span>
        <p>No snapshots found</p>
      </div>
    } @else {
      <div class="chart-wrapper glass-border">
        <div echarts [options]="chartOptions()" [autoResize]="true" class="echarts-el"></div>
      </div>

      <div class="grid-wrapper glass-border">
        <ag-grid-angular 
          [theme]="gridTheme" 
          [rowData]="history()" 
          [columnDefs]="colDefs"
          [defaultColDef]="{ sortable: true, resizable: true }" 
          [animateRows]="true" 
          [rowHeight]="52"
          (gridReady)="onGridReady($event)" />
      </div>
    }
  </div>

  <footer class="dialog-footer">
    <button class="sav-btn secondary" (click)="dialogRef.close()">Close Analytics</button>
  </footer>
</div>
