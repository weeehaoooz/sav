<form [formGroup]="form" (ngSubmit)="onSubmit()" class="asset-type-form fade-in">
  <div class="form-container">
    <div class="section-header">
      <mat-icon>account_balance</mat-icon>
      <h3>Bank Account Details</h3>
    </div>

    <div class="form-grid">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Bank / Account Name</mat-label>
        <input matInput formControlName="name" placeholder="e.g. DBS Multiplier" id="bank-name-input" />
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Current Balance (SGD)</mat-label>
        <input matInput type="number" formControlName="current_value" id="bank-value-input" />
        <mat-icon matPrefix>payments</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>As of Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="valuation_date" id="bank-date-input">
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-icon matPrefix>calendar_today</mat-icon>
      </mat-form-field>
    </div>
  </div>

  <div class="form-actions">
    <button mat-button type="button" (click)="cancel.emit()" id="bank-cancel-btn">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid" id="bank-save-btn">
      Save Asset
    </button>
  </div>
</form>
