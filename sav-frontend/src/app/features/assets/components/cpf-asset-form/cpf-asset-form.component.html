<form [formGroup]="form" (ngSubmit)="onSubmit()" class="asset-type-form fade-in">
  <div class="form-section">
    <div class="section-header">
      <mat-icon>account_balance_wallet</mat-icon>
      <h3>Consolidated CPF Details</h3>
    </div>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Consolidated Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. My CPF Accounts" id="cpf-name-input" />
    </mat-form-field>

    <div class="form-grid">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Ordinary Account (OA)</mat-label>
        <input matInput type="number" formControlName="cpf_oa" id="cpf-oa-input" />
        <mat-icon matPrefix class="icon-oa">home</mat-icon>
        <span matPrefix>$&nbsp;</span>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Special Account (SA)</mat-label>
        <input matInput type="number" formControlName="cpf_sa" id="cpf-sa-input" />
        <mat-icon matPrefix class="icon-sa">security</mat-icon>
        <span matPrefix>$&nbsp;</span>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Medisave Account (MA)</mat-label>
        <input matInput type="number" formControlName="cpf_ma" id="cpf-ma-input" />
        <mat-icon matPrefix class="icon-ma">medical_services</mat-icon>
        <span matPrefix>$&nbsp;</span>
      </mat-form-field>

      <!-- @if (userAge >= 55) {
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Retirement Account (RA)</mat-label>
        <input matInput type="number" formControlName="cpf_ra" id="cpf-ra-input" />
        <mat-icon matPrefix class="icon-ra">elderly</mat-icon>
        <span matPrefix>$&nbsp;</span>
      </mat-form-field>
      } -->
    </div>

    <div class="total-summary glass dot-grid">
      <div class="summary-label">Estimated Total CPF Balance</div>
      <div class="summary-value">SGD {{ (form.get('current_value')?.value || 0) | number:'1.2-2' }}</div>
    </div>

    <mat-form-field appearance="fill" class="full-width" style="margin-top: 16px;">
      <mat-label>Valuation Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="valuation_date" id="cpf-date-input">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-icon matPrefix>calendar_today</mat-icon>
    </mat-form-field>
  </div>

  <div class="form-actions">
    <button mat-button type="button" (click)="cancel.emit()" id="cpf-cancel-btn">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid" id="cpf-save-btn">
      Update CPF
    </button>
  </div>
</form>
