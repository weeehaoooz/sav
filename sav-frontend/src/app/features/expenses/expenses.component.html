<div class="page-content fade-in">
  <app-page-header title="Expenses" subtitle="Track your spending" actionLabel="Add Expense" actionIcon="add" (actionClicked)="openCreate()" />
  <div class="metrics-grid" style="margin-bottom:24px;">
    @for (m of metrics(); track m.label) { <app-metric-card [config]="m" /> }
  </div>
  <div class="content-split" [class.form-open]="showForm()">
    <div class="table-wrapper glass">
      <ag-grid-angular [theme]="gridTheme" [rowData]="state.expenses()" [columnDefs]="colDefs" [defaultColDef]="defaultColDef" [animateRows]="true" style="height:480px;width:100%;" />
    </div>
    @if (showForm()) {
      <div class="form-panel glass fade-in">
        <div class="form-header">
          <h4>{{ editingId() ? 'Edit Expense' : 'New Expense' }}</h4>
          <button mat-icon-button (click)="cancelForm()"><mat-icon>close</mat-icon></button>
        </div>
        <form [formGroup]="expenseForm" (ngSubmit)="save()" class="expense-form">
          <mat-form-field appearance="fill"><mat-label>Name</mat-label><input matInput formControlName="name" id="expense-name-input" /></mat-form-field>
          <mat-form-field appearance="fill"><mat-label>Category</mat-label>
            <mat-select formControlName="category" id="expense-category-select">
              @for (c of categories; track c.value) { <mat-option [value]="c.value">{{ c.label }}</mat-option> }
            </mat-select>
          </mat-form-field>
          <mat-form-field appearance="fill"><mat-label>Amount (SGD)</mat-label><input matInput type="number" formControlName="amount" id="expense-amount-input" /></mat-form-field>
          <mat-form-field appearance="fill"><mat-label>Frequency</mat-label>
            <mat-select formControlName="frequency" id="expense-freq-select">
              @for (f of frequencies; track f.value) { <mat-option [value]="f.value">{{ f.label }}</mat-option> }
            </mat-select>
          </mat-form-field>
          <mat-form-field appearance="fill"><mat-label>Inflation Rate (e.g. 0.02)</mat-label><input matInput type="number" step="0.005" formControlName="inflation_rate" id="expense-inflation-input" /></mat-form-field>
          <div class="form-actions">
            <button mat-button type="button" (click)="cancelForm()">Cancel</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="saving()" id="expense-save-btn">{{ saving() ? 'Saving…' : (editingId() ? 'Update' : 'Add') }}</button>
          </div>
        </form>
      </div>
    }
  </div>
</div>
