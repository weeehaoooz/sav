<div class="tab-pane fade-in">
  <div class="pane-header">
    <h2>App Preferences</h2>
    <p class="text-muted">Customize the platform's appearance and behavior.</p>
  </div>

  <div class="preference-list">
    <!-- Theme Preference -->
    <div class="preference-item vertical">
      <div class="pref-info">
        <h3>Theme Mode</h3>
        <p>Choose your preferred interface appearance.</p>
      </div>
      <div class="theme-selector">
        <button class="theme-card" 
          [class.active]="themeService.themeMode() === 'light'"
          (click)="themeService.setThemeMode('light')"
          aria-label="Set light theme">
          <div class="theme-card-icon">
            <mat-icon>light_mode</mat-icon>
          </div>
          <span>Light</span>
        </button>
        <button class="theme-card" 
          [class.active]="themeService.themeMode() === 'dark'"
          (click)="themeService.setThemeMode('dark')"
          aria-label="Set dark theme">
          <div class="theme-card-icon">
            <mat-icon>dark_mode</mat-icon>
          </div>
          <span>Dark</span>
        </button>
        <button class="theme-card" 
          [class.active]="themeService.themeMode() === 'system'"
          (click)="themeService.setThemeMode('system')"
          aria-label="Follow system theme">
          <div class="theme-card-icon">
            <mat-icon>settings_brightness</mat-icon>
          </div>
          <span>System</span>
        </button>
      </div>
    </div>

    <mat-divider></mat-divider>

    <!-- Animations Preference -->
    <div class="preference-item">
      <div class="pref-info">
        <h3>Reduced Animations</h3>
        <p>Minimize motion and transitions across the application.</p>
      </div>
      <div class="pref-action">
        <mat-slide-toggle 
          [checked]="themeService.reducedAnimations()"
          (change)="themeService.toggleAnimations()"
          color="primary">
          {{ themeService.reducedAnimations() ? 'Enabled' : 'Disabled' }}
        </mat-slide-toggle>
      </div>
    </div>
  </div>
</div>
