<div class="login-container">
  <div class="theme-toggle-wrapper">
    <app-theme-toggle></app-theme-toggle>
  </div>
  <div class="login-card glass">
    <div class="login-header">
      <app-logo class="login-logo"></app-logo>
      <h1>Welcome Back</h1>
      <p>Sign in to manage your family wealth</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" placeholder="Enter your username">
        <mat-icon matPrefix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password">
        <mat-icon matPrefix>lock</mat-icon>
        <button mat-icon-button matSuffix (click)="togglePassword($event)" [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hidePassword()">
          <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>

      @if (error()) {
      <div class="error-message">
        <mat-icon>error_outline</mat-icon>
        <span>{{ error() }}</span>
      </div>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="loading() || loginForm.invalid"
        class="submit-btn">
        @if (loading()) {
        <mat-spinner diameter="20"></mat-spinner>
        } @else {
        Sign In
        }
      </button>
    </form>

    <div class="register-link">
      Don't have an account? <a routerLink="/register">Sign up</a>
    </div>
  </div>
</div>
