<div class="register-container">
  <div class="theme-toggle-wrapper">
    <app-theme-toggle></app-theme-toggle>
  </div>
  <div class="register-card glass">
    <div class="register-header">
      <app-logo class="register-logo"></app-logo>
      <h1>Create Account</h1>
      <p>Start managing your family wealth today</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <div class="name-row">
        <mat-form-field appearance="outline">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="first_name" placeholder="First name">
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="last_name" placeholder="Last name">
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" placeholder="Choose a username">
        <mat-icon matPrefix>account_circle</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="Enter your email">
        <mat-icon matPrefix>email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password">
        <mat-icon matPrefix>lock</mat-icon>
        <button mat-icon-button matSuffix (click)="togglePassword($event)" [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hidePassword()">
          <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirm Password</mat-label>
        <input matInput [type]="hideConfirmPassword() ? 'password' : 'text'" formControlName="confirm_password">
        <mat-icon matPrefix>lock</mat-icon>
        <button mat-icon-button matSuffix (click)="toggleConfirmPassword($event)" [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hideConfirmPassword()">
          <mat-icon>{{hideConfirmPassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
        @if (passwordMismatch()) {
        <mat-error>Passwords do not match</mat-error>
        }
      </mat-form-field>

      @if (error()) {
      <div class="error-message">
        <mat-icon>error_outline</mat-icon>
        <span>{{ error() }}</span>
      </div>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="loading() || registerForm.invalid || passwordMismatch()"
        class="submit-btn">
        @if (loading()) {
        <mat-spinner diameter="20"></mat-spinner>
        } @else {
        Create Account
        }
      </button>
    </form>

    <div class="login-link">
      Already have an account? <a routerLink="/login">Sign in</a>
    </div>
  </div>
</div>
