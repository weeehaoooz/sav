<div class="page-content fade-in">
  <app-page-header title="Family Members" subtitle="Manage accounts, children, and sharing access"
    actionLabel="Add Member" actionIcon="person_add" (actionClicked)="openCreate()" />

  <div class="family-layout" [class.form-open]="showForm()">
    <!-- Profiles Grid -->
    <div class="profiles-grid">
      @for (acc of userService.accounts(); track acc.id) {
      <app-account-card [account]="acc" (edit)="openEdit($event)" (delete)="deleteAccount($event)" />
      } @empty {
      @if (!userService.loading()) {
      <div class="empty-state glass">No accounts found.</div>
      }
      }
    </div>

    <!-- Form Panel -->
    @if (showForm()) {
    <div class="form-panel glass fade-in">
      <app-member-form [account]="editingAccount()" [saving]="saving()" (save)="save($event)" (cancel)="cancelForm()" />
    </div>
    }
  </div>
</div>
