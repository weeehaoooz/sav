<div class="chart-card glass">
  <div class="card-header">
    <div>
      <h4 class="card-title">{{ title() }}</h4>
      @if (subtitle()) {
        <p class="card-subtitle">{{ subtitle() }}</p>
      }
    </div>
  </div>
  <div class="chart-wrapper" [style.height]="height()">
    @if (loading()) {
      <div class="chart-loading">
        <div class="loading-shimmer" style="width:100%;height:100%;border-radius:8px;"></div>
      </div>
    } @else {
      <div echarts [options]="options()" class="chart" [style.height]="height()"></div>
    }
  </div>
</div>
